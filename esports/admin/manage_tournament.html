<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BattleZone – Manage Tournament</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <span class="admin-sidebar-brand">⚡ BattleZone</span>
    <a href="index.html" class="admin-nav-link"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
    <a href="tournament.html" class="admin-nav-link active"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg>Tournaments</a>
    <a href="users.html" class="admin-nav-link"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Users</a>
    <a href="settings.html" class="admin-nav-link"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
    <div style="position:absolute;bottom:20px;left:0;right:0;padding:0 20px">
      <button onclick="Auth.adminLogout()" style="width:100%;padding:8px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:6px;color:var(--red);cursor:pointer;font-size:0.82rem">Logout</button>
    </div>
  </aside>

  <main class="admin-main">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <a href="tournament.html" style="color:var(--muted);text-decoration:none;font-size:0.85rem">← Back</a>
      <h2 id="pageTitle">Manage Tournament</h2>
    </div>

    <!-- Tournament Info -->
    <div class="card card-highlight" style="margin-bottom:20px" id="tInfo"></div>

    <!-- Status Control -->
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-bottom:12px">⚡ Tournament Status</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="setStatus('upcoming')" style="background:rgba(245,158,11,0.15);border:1px solid var(--yellow);color:var(--yellow);width:auto">🟡 Upcoming</button>
        <button class="btn btn-sm" onclick="setStatus('live')" style="background:rgba(239,68,68,0.15);border:1px solid var(--red);color:var(--red);width:auto">🔴 Set Live</button>
      </div>
    </div>

    <!-- Room Details -->
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-bottom:12px">🔑 Room Details</h3>
      <div class="form-group">
        <label class="form-label">Room ID</label>
        <input class="form-input" type="text" id="roomId" placeholder="Enter Room ID">
      </div>
      <div class="form-group">
        <label class="form-label">Room Password</label>
        <input class="form-input" type="text" id="roomPass" placeholder="Enter Room Password">
      </div>
      <button class="btn btn-primary" onclick="saveRoom()">Save Room Details</button>
    </div>

    <!-- Participants -->
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-bottom:12px">👥 Participants (<span id="pCount">0</span>)</h3>
      <div id="participantTable" style="overflow-x:auto"></div>
    </div>

    <!-- Declare Winner -->
    <div class="card" id="winnerSection">
      <h3 style="margin-bottom:12px">🏆 Declare Winner</h3>
      <div class="form-group">
        <label class="form-label">Select Winner</label>
        <select class="form-input" id="winnerSelect"></select>
      </div>
      <button class="btn btn-success" onclick="declareWinner()">🏆 Declare Winner & Distribute Prize</button>
    </div>
  </main>
</div>

<nav class="admin-mobile-nav">
  <a href="index.html"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Home</a>
  <a href="tournament.html" class="active"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg>Events</a>
  <a href="users.html"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Users</a>
  <a href="settings.html"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
</nav>

<script src="../js/app.js"></script>
<script>
if (!Auth.requireAdmin()) {}
const params = new URLSearchParams(window.location.search);
const tid = parseInt(params.get('id'));
if (!tid) window.location.href = 'tournament.html';

let tournament;

function init() {
  tournament = Tournaments.find(tid);
  if (!tournament) { window.location.href = 'tournament.html'; return; }

  document.getElementById('pageTitle').textContent = tournament.title;
  document.getElementById('tInfo').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-family:'Rajdhani',sans-serif;font-size:1.2rem;font-weight:700">${tournament.title}</div>
        <div style="font-size:0.8rem;color:var(--accent2);margin-top:2px">🎮 ${tournament.game_name}</div>
        <div style="font-size:0.78rem;color:var(--muted);margin-top:4px">⏰ ${fmt.date(tournament.match_time)}</div>
      </div>
      <span class="badge badge-${tournament.status}">${tournament.status.toUpperCase()}</span>
    </div>
    <div style="display:flex;gap:20px;margin-top:12px">
      <div><div style="font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;color:var(--accent3)">${fmt.inr(tournament.entry_fee)}</div><div style="font-size:0.7rem;color:var(--muted)">Entry Fee</div></div>
      <div><div style="font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;color:var(--accent3)">${fmt.inr(tournament.prize_pool)}</div><div style="font-size:0.7rem;color:var(--muted)">Prize Pool</div></div>
      <div><div style="font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;color:var(--yellow)">${tournament.commission_pct || 20}%</div><div style="font-size:0.7rem;color:var(--muted)">Commission</div></div>
    </div>`;

  // Room
  document.getElementById('roomId').value = tournament.room_id || '';
  document.getElementById('roomPass').value = tournament.room_password || '';

  // Participants
  const parts = Participants.forTournament(tid);
  document.getElementById('pCount').textContent = parts.length;
  const pTable = document.getElementById('participantTable');
  if (!parts.length) {
    pTable.innerHTML = '<p style="color:var(--muted);font-size:0.85rem;text-align:center;padding:16px">No participants yet</p>';
  } else {
    pTable.innerHTML = `<table class="tbl"><thead><tr><th>#</th><th>Username</th><th>Joined</th><th>Result</th></tr></thead><tbody>` +
      parts.map((p, i) => {
        const u = Users.findById(p.user_id);
        return `<tr><td style="color:var(--muted)">${i+1}</td><td style="font-weight:600">${u?.username || '—'}</td><td style="color:var(--muted);font-size:0.78rem">${u?.email || '—'}</td><td><span style="font-size:0.78rem;color:${p.result === 'Winner' ? 'var(--accent3)' : 'var(--muted)'}">${p.result || 'Participated'}</span></td></tr>`;
      }).join('') + '</tbody></table>';
  }

  // Winner select
  const sel = document.getElementById('winnerSelect');
  if (tournament.status === 'completed') {
    document.getElementById('winnerSection').innerHTML = `<div style="text-align:center;padding:16px"><div style="font-size:1.5rem;margin-bottom:8px">🏆</div><div style="font-weight:700;color:var(--accent3)">Winner Declared!</div><div style="font-size:0.82rem;color:var(--muted);margin-top:4px">${Users.findById(tournament.winner_id)?.username || '—'}</div></div>`;
    return;
  }
  sel.innerHTML = parts.length
    ? parts.map(p => { const u = Users.findById(p.user_id); return `<option value="${p.user_id}">${u?.username || p.user_id}</option>`; }).join('')
    : '<option value="">No participants</option>';
}

function setStatus(status) {
  Tournaments.update(tid, { status });
  showToast(`Status → ${status}`);
  init();
}

function saveRoom() {
  const rid = document.getElementById('roomId').value.trim();
  const rpass = document.getElementById('roomPass').value.trim();
  if (!rid || !rpass) { showToast('Enter both Room ID and Password', 'error'); return; }
  Tournaments.update(tid, { room_id: rid, room_password: rpass, status: 'live' });
  showToast('✅ Room details saved & tournament set to LIVE!');
  init();
}

function declareWinner() {
  const winnerId = parseInt(document.getElementById('winnerSelect').value);
  if (!winnerId) { showToast('Select a participant', 'error'); return; }
  const t = Tournaments.find(tid);
  if (!confirm(`Declare ${Users.findById(winnerId)?.username} as winner and distribute ${fmt.inr(t.prize_pool)}?`)) return;

  // Credit winner
  const winner = Users.findById(winnerId);
  Users.update(winnerId, { wallet_balance: winner.wallet_balance + t.prize_pool });
  Transactions.add(winnerId, t.prize_pool, 'credit', `🏆 Prize: ${t.title}`);
  Participants.setResult(winnerId, tid, 'Winner');
  Tournaments.update(tid, { status: 'completed', winner_id: winnerId });

  showToast(`🏆 Winner declared! ${fmt.inr(t.prize_pool)} credited to ${winner.username}`);
  init();
}

init();
</script>
</body>
</html>
